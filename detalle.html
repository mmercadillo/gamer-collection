<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ficha trasladada · PC Game Archive</title>
<meta name="robots" content="noindex,follow" />
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var slug=(params.get('juego')||'').trim().toLowerCase();
  var target="https://www.pcgamearchive.org/";
  if(/^[a-z0-9-]+$/.test(slug)){
    target="https://www.pcgamearchive.org/juegos/"+slug+'/';
  }
  location.replace(target);
})();
</script>
</head>
<body>
<p>La ficha se ha trasladado. <a href="https://www.pcgamearchive.org/">Ir a PC Game Archive</a>.</p>
</body>
</html>
