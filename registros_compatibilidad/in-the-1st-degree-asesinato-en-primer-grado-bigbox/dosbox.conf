[sdl]
fullscreen = true

[dosbox]
machine = svga_s3
memsize = 32

[cpu]
core = normal
cputype = auto
cpu_cycles = 40000
cpu_cycles_protected = 40000
cpu_throttle = false

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[midi]
mpu401 = intelligent
mididevice = port

[autoexec]
@echo off
mount d "..\CD\1STDEGREE1.ISO" "..\CD\1STDEGREE2.ISO"
c:
call AUTOEXEC.BAT
cd \INTHE1ST
win DEGREE.EXE
exit
